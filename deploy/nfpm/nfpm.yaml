# .deb and .rpm of the static Linux binary (issue #41), built by
# .github/workflows/release.yml:
#   VERSION=0.2.0 ARCH=amd64 nfpm package -f deploy/nfpm/nfpm.yaml -p deb -t dist/
# The binary is expected at dist/pkg/xherd. ARCH is amd64 or arm64 (nfpm
# names it x86_64 / aarch64 in the rpm).
name: xherd
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: semver
section: devel
maintainer: xherd <https://github.com/xionjames/xherd>
description: |-
  Runs, watches and steers many coding agents, each in its own git worktree
  and tmux session, with approval gates.
homepage: https://github.com/xionjames/xherd
license: MIT
depends:
  - git
  - tmux (>= 3.3)
overrides:
  rpm:
    depends:
      - git
      - tmux >= 3.3
contents:
  - src: dist/pkg/xherd
    dst: /usr/bin/xherd
    file_info:
      mode: 0755
  - src: LICENSE
    dst: /usr/share/doc/xherd/LICENSE
  - src: README.md
    dst: /usr/share/doc/xherd/README.md
