[package]
name = "xherd-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "xherd"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
fd-lock = "4.0.4"
nix = { version = "0.31.3", features = ["user", "fs"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "signal", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
ureq = { version = "3.5.1", features = ["json"] }
xherd-api = { version = "0.1.0", path = "../xherd-api" }
xherd-core = { version = "0.1.0", path = "../xherd-core" }
xherd-daemon = { version = "0.1.0", path = "../xherd-daemon" }
xherd-git = { version = "0.1.0", path = "../xherd-git" }
xherd-plugin = { version = "0.1.0", path = "../xherd-plugin" }
xherd-store = { version = "0.1.0", path = "../xherd-store" }
xherd-term = { version = "0.1.0", path = "../xherd-term" }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
xherd-flow = { path = "../xherd-flow" }
