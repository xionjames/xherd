[package]
name = "xherd-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nix = { version = "0.31.3", features = ["signal", "process"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "time", "io-util", "rt", "macros"] }
tracing = "0.1.44"
ulid = "3.0.0"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }

[lints]
workspace = true
