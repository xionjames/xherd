# xherd, the built-in flow pack (spec §7, design §6.2).
# v0: the feature flow only; bug and hotfix come later.
name: xherd
version: 0.1.0
protocol: 1
specDir: private
requiresCommitted: false
private: [pr-comments.json, pr-decisions.json, pr-templates.json, HANDOFF.md]

install:
  claude-code:
    prefix: "/xherd:"
    commands: { from: commands/*.md, to: "${CLAUDE_CONFIG_DIR:-~/.claude}/commands/xherd/{name}.md", format: command }
    args: "$ARGUMENTS"
  # opencode names a command by its path under command/: xherd/next.md is
  # /xherd/next. A command without arguments needs a second Enter (the first
  # picks it in the completion list); after one with arguments it does nothing.
  opencode:
    prefix: "/xherd/"
    slashEnters: 2
    commands: { from: commands/*.md, to: "${XDG_CONFIG_HOME:-~/.config}/opencode/command/xherd/{name}.md", format: command }
    args: "$ARGUMENTS"
  # Codex has skills, not commands: one folder each, called as $xherd-next
  # (only by name: agents/openai.yaml turns implicit use off). Typing
  # "$xherd-resume" opens the skill list, whose first Enter only picks it.
  # Skills get no argument substitution: the arguments are the rest of the
  # message.
  codex:
    prefix: "$xherd-"
    slashEnters: 2
    commands: { from: commands/*.md, to: "${CODEX_HOME:-~/.codex}/skills/xherd-{name}/SKILL.md", format: skill }
    args: "the text after the skill name in the message"

commands: { resume: "{prefix}resume", handoff: "{prefix}handoff", status: "{prefix}status", prReview: "{prefix}pr-review" }

flows:
  feature:
    start: "{prefix}feature {key} {prompt}"
    stages:
      - id: spec
        role: spec
        class: critical
        gate: { docs: [spec.md] }
        next:
          - when: { frontmatter: { file: spec.md, key: design, equals: skip } }
            run: "{prefix}tasks"
          - run: "{prefix}design"
      - { id: design, role: design, class: routine, gate: { docs: [design.md] }, next: [{ run: "{prefix}tasks" }] }
      - { id: tasks, role: tasks, class: routine, gate: { docs: [tasks.md] }, next: [{ run: "{prefix}next" }] }
      - { id: implement, role: implement, class: code, gate: { kind: commit }, next: [{ run: "{prefix}commit {commit}" }], loopUntil: allTasksDone, then: review }
      - { id: review, role: review, class: routine, gate: { docs: [review.md] }, next: [{ run: "{prefix}ship" }] }
      - { id: ship, role: ship, class: critical, gate: { docs: [pr.md] }, next: [{ run: "{prefix}ship", autoApproved: "{prefix}ship --no-ticket-update" }] }
      - { id: pr-review, role: pr, class: human-only, gate: { docs: [pr-review.md] }, next: [{ run: "{prefix}pr-apply" }] }
      - { id: pr, role: pr, class: human-only }
